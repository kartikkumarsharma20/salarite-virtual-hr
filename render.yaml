# Render.com Blueprint for Salarite Virtual HR
services:
  # -------------------------------------------------------------
  # Backend Web Service (FastAPI + Uvicorn)
  # -------------------------------------------------------------
  - type: web
    name: salarite-virtual-hr-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440
      - key: DATABASE_URL
        value: sqlite:///./database/salarite_hr.db
      - key: CORS_ORIGINS
        value: https://salarite-virtual-hr-frontend.onrender.com,http://localhost:5173

  # -------------------------------------------------------------
  # Frontend Static Site (React + Vite)
  # -------------------------------------------------------------
  - type: web
    name: salarite-virtual-hr-frontend
    env: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://salarite-virtual-hr-backend.onrender.com/api
